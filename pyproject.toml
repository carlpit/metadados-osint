[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metascan"
version = "0.1.0"
description = "Analisador de metadados de imagens e documentos para OSINT ético e revisão de privacidade."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlos Vinicius" }]
keywords = [
    "osint",
    "metadata",
    "exif",
    "privacy",
    "lgpd",
    "pdf",
    "forensics",
    "python",
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "pillow>=10.0.0",
    "piexif>=1.1.3",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
rich = ["rich>=13.0.0"]
heic = ["pillow-heif>=0.16.0"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "rich>=13.0.0",
]

[project.scripts]
metascan = "metascan.cli:main"

[project.urls]
Homepage = "https://github.com/carlpit/metadados-osint"
Issues = "https://github.com/carlpit/metadados-osint/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
